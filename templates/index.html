<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FaceMark</title>

    <!-- Bootstrap (quick professional UI) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link
      href="{{ url_for('static', filename='styles.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand brand" href="/">FaceMark</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary btn-sm" href="/admin"
            >Manage Faces</a
          >
        </div>
      </div>
    </nav>

    <div class="card app-card shadow-sm">
      <div class="card-body">
        <div
          class="d-flex justify-content-between align-items-center align-self-center"
        >
          <h5 class="card-title align-self-center">Live Camera</h5>
          <div id="status" class="text-muted small mb-3">
            <span class="status-indicator"></span>
            <span class="status-text">Models loading…</span>
          </div>
        </div>
        <div id="wrapper" class="mb-3">
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
          <div id="guide-box"></div>
        </div>

        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-3"
        ></div>

        <div id="result"></div>
      </div>
    </div>

    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <!-- your app script served by Flask static/ -->

    <script src="{{ url_for('static', filename='presence_state_machine.js') }}"></script>
    <script src="{{ url_for('static', filename='tracker_pool.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
